name: Publish Docker image

on:
  push:
    branches: [dev]
  workflow_dispatch:   # allows running it manually from the Actions tab

permissions:
  contents: read
  packages: write      # lets GITHUB_TOKEN push to ghcr.io

env:
  # ghcr.io requires a lowercase image name
  IMAGE: ghcr.io/jacobmagnusbardie/whoknows

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # dev = newest on dev; the commit SHA pins an exact, rollback-able version
          tags: |
            ${{ env.IMAGE }}:dev
            ${{ env.IMAGE }}:${{ github.sha }}