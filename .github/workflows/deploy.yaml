name: Deploy to Azure VM

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Sæt Go op
        uses: actions/setup-go@v5
        with:
          # Reads the version from the go directive so deploy cannot drift from go.mod
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Byg Go-applikationen
        working-directory: ./backend
        run: go build -o whoknows-app .

      - name: Kopiér filer til VM via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          source: "backend/whoknows-app,frontend/*"
          target: "/home/${{ secrets.AZURE_VM_USER }}/whoknows"

      - name: Ret SELinux-kontekst på binary
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          script: sudo chcon -t bin_t /home/${{ secrets.AZURE_VM_USER }}/whoknows/backend/whoknows-app

      - name: Genstart applikationen på VM'en
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          script: |
            sudo systemctl restart whoknows

      # systemctl restart succeeds as soon as the process starts, even if the app exits a second
      # later (e.g. missing SESSION_HASH_KEY). Wait for it to answer, so a broken deploy fails here
      # and the release job below never runs.
      - name: Tjek at applikationen svarer
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          script: |
            for i in $(seq 1 10); do
              curl -fsS -o /dev/null http://localhost:8080/ && exit 0
              sleep 2
            done
            sudo journalctl -u whoknows -n 30 --no-pager
            exit 1

  # Tags and publishes a GitHub Release for every release PR merged into main.
  # The version comes from the PR title ("release: vX.Y.Z", see
  # Docs/conventions_contract/releases_and_versioning.md), and it only runs once the
  # deploy succeeded, so a release always means "this is what runs on the VM".
  release:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the tag and the release
      pull-requests: read  # look up the title of the merged release PR
    steps:
      - name: Tag and publish release from the PR title
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            --jq 'map(select(.base.ref == "main")) | .[0].title // ""')
          version=$(echo "$title" | sed -nE 's/^release: (v[0-9]+\.[0-9]+\.[0-9]+)$/\1/p')

          if [ -z "$version" ]; then
            echo "::error::Merged PR title '$title' is not 'release: vX.Y.Z', so no release was created"
            exit 1
          fi

          # Creates the tag on the merge commit; fails if the version already exists
          gh release create "$version" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "$version" \
            --generate-notes
