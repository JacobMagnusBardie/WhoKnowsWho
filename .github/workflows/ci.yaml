name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, vet and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # Reads the version from the go directive so CI cannot drift from go.mod
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: check generated API specification
        run: make spec-check

      - name: Build
        working-directory: ./backend
        run: go build ./...

      - name: Vet
        working-directory: ./backend
        run: go vet ./...

      - name: Test
        working-directory: ./backend
        run: go test ./... -coverprofile=coverage.out -covermode=atomic

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Needed so the linter can diff against the merge base
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # Third-party actions are pinned to a commit SHA (a tag can be moved to other code);
      # Dependabot updates the SHA and the version comment together.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          working-directory: backend
          # The Go rewrite already carries lint debt (see the cleanup issue).
          # Gate NEW code only, so the check is green today and the debt cannot
          # grow. Running `golangci-lint run` locally still reports everything.
          args: --new-from-merge-base=origin/${{ github.base_ref || 'dev' }}

  hadolint:
    name: hadolint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

  trivy:
    name: Trivy image scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Build the same image docker-publish.yaml pushes, but only into the local Docker daemon
      - name: Build the image
        run: docker build -t whoknows:ci .

      # Fails on HIGH/CRITICAL vulnerabilities that have a fix available, in the alpine
      # packages and in the Go modules compiled into the binary. Unfixed ones are skipped,
      # since there is nothing we can upgrade to yet.
      # Pinned to the SHA of v0.36.0: tags 0.0.1–0.34.2 were hijacked in March 2026
      # (CVE-2026-33634); v0.36.0 is an immutable release that pins setup-trivy by SHA.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: whoknows:ci
          version: v0.76.1
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Playwright starts the app with `go run .` (see e2e/playwright.config.js)
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install dependencies
        working-directory: ./e2e
        run: npm ci

      - name: Install Chromium
        working-directory: ./e2e
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        working-directory: ./e2e
        run: npx playwright test

      # The HTML report holds a trace (screenshots, DOM, network) of every failed test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
