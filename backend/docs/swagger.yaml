basePath: /
definitions:
  AuthResponse:
    properties:
      message:
        type: string
      statusCode:
        type: integer
    type: object
  HTTPValidationError:
    properties:
      detail:
        items:
          $ref: '#/definitions/ValidationError'
        type: array
    type: object
  RequestValidationError:
    properties:
      detail:
        items:
          $ref: '#/definitions/ValidationError'
        type: array
      message:
        type: string
        x-nullable: true
      statusCode:
        default: 422
        type: integer
    type: object
  SearchResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/SearchResult'
        type: array
    required:
    - data
    type: object
  SearchResult:
    properties:
      description:
        type: string
      title:
        type: string
      url:
        type: string
    type: object
  StandardResponse:
    properties:
      data:
        additionalProperties: true
        type: object
    required:
    - data
    type: object
  ValidationError:
    properties:
      loc:
        items: {}
        type: array
      msg:
        type: string
      type:
        type: string
    required:
    - loc
    - msg
    - type
    type: object
host: localhost:8080
info:
  contact: {}
  description: API for søgning, login og vejr i WhoKnows-projektet.
  title: WhoKnows API
  version: 0.1.0
paths:
  /:
    get:
      parameters:
      - description: Search query
        in: query
        name: q
        type: string
      produces:
      - text/html
      responses:
        "200":
          description: HTML
          schema:
            type: string
      summary: Serve Root Page
  /about:
    get:
      produces:
      - text/html
      responses:
        "200":
          description: HTML
          schema:
            type: string
      summary: Serve About Page
  /api/change-password:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: Changes the password of the logged-in user and clears the must-change-password
        flag. The new password must differ from the old one.
      parameters:
      - description: Current password
        in: formData
        name: old_password
        required: true
        type: string
      - description: New password
        in: formData
        name: new_password
        required: true
        type: string
      - description: Repeat new password
        in: formData
        name: new_password2
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/AuthResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/AuthResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/HTTPValidationError'
      summary: Change password
  /api/login:
    post:
      consumes:
      - application/x-www-form-urlencoded
      parameters:
      - description: Username
        in: formData
        name: username
        required: true
        type: string
      - description: Password
        in: formData
        name: password
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/AuthResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/HTTPValidationError'
      summary: Login
  /api/logout:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/AuthResponse'
      summary: Logout
  /api/register:
    post:
      consumes:
      - application/x-www-form-urlencoded
      parameters:
      - description: Username
        in: formData
        name: username
        required: true
        type: string
      - description: Email
        in: formData
        name: email
        required: true
        type: string
      - description: Password
        in: formData
        name: password
        required: true
        type: string
      - description: Repeat password
        in: formData
        name: password2
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/AuthResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/HTTPValidationError'
      summary: Register
  /api/search:
    get:
      parameters:
      - description: Search query
        in: query
        name: q
        required: true
        type: string
      - description: Language code (e.g. 'en')
        in: query
        name: language
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/SearchResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/RequestValidationError'
      summary: Search
  /api/weather:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/StandardResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/HTTPValidationError'
      summary: Weather
  /change-password:
    get:
      description: Shows the change-password form to a logged-in user, and redirects
        to /login otherwise. Users flagged must_change_password are sent here by every
        other page.
      produces:
      - text/html
      responses:
        "200":
          description: HTML
          schema:
            type: string
      summary: Serve Change Password Page
  /health:
    get:
      description: Returns 200 when the app is running and the database answers, 503
        otherwise.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Health check
  /login:
    get:
      produces:
      - text/html
      responses:
        "200":
          description: HTML
          schema:
            type: string
      summary: Serve Login Page
  /register:
    get:
      produces:
      - text/html
      responses:
        "200":
          description: HTML
          schema:
            type: string
      summary: Serve Register Page
  /weather:
    get:
      produces:
      - text/html
      responses:
        "200":
          description: HTML
          schema:
            type: string
      summary: Serve Weather Page
swagger: "2.0"
