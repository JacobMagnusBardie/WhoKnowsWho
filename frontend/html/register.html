{{define "body"}}
  <h2>Sign Up</h2>
  {{if .Error}}<div class="error"><strong>Error:</strong> {{.Error}}</div>{{end}}
  <form action="/api/register" method="POST">
    <dl>
      <dt><label for="username">Username:</label>
      <dd><input type="text" id="username" name="username" size="30" value="{{.Username}}">
      <dt><label for="email">E-Mail:</label>
      <dd><input type="text" id="email" name="email" size="30" value="{{.Email}}">
      <dt><label for="password">Password:</label>
      <dd><input type="password" id="password" name="password" size="30">
      <dt><label for="password2">Password <small>(repeat)</small>:</label>
      <dd><input type="password" id="password2" name="password2" size="30">
    </dl>
    <div class="actions"><input type="submit" value="Sign Up"></div>
  </form>
{{end}}
