{{define "body"}}
  <h2>Change Password</h2>
  {{if .Error}}<div class="error"><strong>Error:</strong> {{.Error}}</div>{{end}}
  <form action="/api/change-password" method="POST">
    <dl>
      <dt><label for="old_password">Old password:</label>
      <dd><input type="password" id="old_password" name="old_password" size="30" required>
      <dt><label for="new_password">New password:</label>
      <dd><input type="password" id="new_password" name="new_password" size="30" required>
      <dt><label for="new_password2">New password <small>(repeat)</small>:</label>
      <dd><input type="password" id="new_password2" name="new_password2" size="30" required>
    </dl>
    <div class="actions"><input type="submit" value="Change Password"></div>
  </form>
{{end}}
