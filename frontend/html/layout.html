{{define "layout"}} <!-- defined as layout, to render html pages with a layout. (See L. 25 main.go) -->
<!doctype html>
<title>{{if .Title}}{{.Title}}{{else}}¿Who Knows?{{end}}</title>
<link rel="stylesheet" type="text/css" href="/static/style.css">
<div class="page">
  <div class="navigation">
  <nav>
    <h1><a id="nav-logo" href="/">¿Who Knows?</a></h1>
    {{if .User}}
    <a id="nav-logout" href="/api/logout">Log out [{{.User.Username}}]</a>
    {{else}}
    <a id="nav-login" href="/login">Log in</a>
    <a id="nav-register" href="/register">Register</a>
    {{end}}
  </nav>
  </div>
  {{if .Flashes}}
  <ul class="flashes">
    {{range .Flashes}}
    <li>{{.}}
    {{end}}
  </ul>
  {{end}}
  <div class="body">
  {{block "body" .}}{{end}} <!-- defined as body in all html files, so that the layout.html template knows what .html to render with a layout. (See L. 25 main.go) -->
  </div>
  <div class="footer">
    <span>¿Who Knows? &copy; 2009</span>
    <a href="/about">About</a>
  </div>
</div>
{{end}}
