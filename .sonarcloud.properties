# SonarQube Cloud - Automatic Analysis configuration.
#
# Automatic Analysis is driven by the GitHub app (already installed on the org),
# so this file is the way to configure it. If we ever switch to scanning from a
# CI job instead, these keys move to sonar-project.properties and Automatic
# Analysis has to be turned off first - the two modes conflict.

# Only the Go rewrite and the frontend it serves are our code.
sonar.sources=backend,frontend

# Deliberately excluded - see Docs/software_quality.md for the reasoning:
#   src/**                 the legacy Flask app. Its README states it "contains
#                          several security vulnerabilities and problematic parts
#                          on purpose", so its findings measure Anders' teaching
#                          material, not our technical debt.
#   backend/API-specs/**   generated by swag; we do not hand-maintain it.
sonar.exclusions=src/**,backend/API-specs/**
