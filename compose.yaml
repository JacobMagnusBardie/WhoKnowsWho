services:
  app:
    # Locally: builds from the Dockerfile. On the VM the deploy workflow sets APP_IMAGE to the
    # ghcr.io image, ENV_FILE to the secrets file and DATA_MOUNT to the bind-mounted data dir.
    build: .
    image: ${APP_IMAGE:-whoknows}
    restart: unless-stopped
    ports:
      # Loopback only: the public entry point is nginx on port 80. Docker writes its own
      # firewall rules, so a plain "8080:8080" would be reachable from the internet even with
      # a host firewall in place. localhost:8080 still works for local development and e2e.
      - "127.0.0.1:8080:8080"
    env_file:
      - ${ENV_FILE:-backend/.env}
    volumes:
      - "${DATA_MOUNT:-whoknows-data}:/data:Z"

  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro,z
    depends_on:
      - app

volumes: 
  whoknows-data: