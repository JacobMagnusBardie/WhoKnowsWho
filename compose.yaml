services:
  app:
    # Locally: builds from the Dockerfile. On the VM the deploy workflow sets APP_IMAGE to the
    # ghcr.io image, ENV_FILE to the secrets file and DATA_MOUNT to the bind-mounted data dir.
    build: .
    image: ${APP_IMAGE:-whoknows}
    # Published directly (not via nginx) so the course simulator can reach the API at
    # http://<vm-ip>:8080. Docker bypasses ufw, so the Azure NSG decides who can connect.
    ports:
      - "8080:8080"
    env_file:
      - ${ENV_FILE:-backend/.env}
    volumes:
      - "${DATA_MOUNT:-whoknows-data}:/data:Z"
    restart: unless-stopped

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro,z
      - /etc/letsencrypt/live/whoknows.swag.dk:/etc/letsencrypt/live/whoknows.swag.dk:ro
      - /etc/letsencrypt/archive/whoknows.swag.dk:/etc/letsencrypt/archive/whoknows.swag.dk:ro
    depends_on:
      - app
    restart: unless-stopped

volumes: 
  whoknows-data: