
# HTTP: all HTTP requests redirects to HTTPS
server {
    listen 80; # default_server;
    # default_server also answers requests that arrive on the bare VM IP, not only the domain
    server_name whoknows.swag.dk www.whoknows.swag.dk;
    # redirects HTTP requests to HTTPS
    return 301 https://$host$request_uri;
}

# HTTPS: TLS ends and request get send to the app.
server {
    listen 443 ssl;
    server_name whoknows.swag.dk www.whoknows.swag.dk;

    ssl_certificate /etc/letsencrypt/live/whoknows.swag.dk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/whoknows.swag.dk/privkey.pem;

    location / {
        # "app" is the compose service name; Docker's DNS resolves it on the compose network
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}